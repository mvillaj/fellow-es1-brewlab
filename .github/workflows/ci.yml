name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The client build is the only step that needs the Clerk key, because Vite
      # substitutes it into the bundle rather than reading it at runtime. A dummy
      # value is correct here: this job proves the bundle compiles, and nothing
      # it produces is deployed.
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_build_only

  deploy:
    name: deploy to fly
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never let two deploys race for the same volume. Queue instead of cancelling:
    # a half-finished deploy that gets cancelled is worse than a slow one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Fail here with a readable message rather than 4 minutes later inside a
      # docker build, or — worse — succeeding with an empty key and shipping a
      # client that cannot sign anyone in.
      - name: Verify required secrets are set
        env:
          CLERK_PK: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          FLY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          missing=""
          if [ -z "$CLERK_PK" ]; then missing="$missing CLERK_PUBLISHABLE_KEY"; fi
          if [ -z "$FLY_TOKEN" ]; then missing="$missing FLY_API_TOKEN"; fi
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only builds on Fly's builder: no Docker needed in CI, and the
      # image is built for amd64 rather than the runner's architecture.
      #
      # Depot (the default) is used deliberately, despite it having failed on a
      # local deploy of this app with "authentication handshake failed: EOF".
      # The legacy builder is not an option here: --depot=false provisions a
      # fly-builder-* app in the org, and FLY_API_TOKEN is a deploy token scoped
      # to this app alone, so it cannot touch one. That combination fails with
      # "Failed to start remote builder heartbeat: unauthorized".
      #
      # If Depot proves flaky in CI too, the fix is a broader token
      # (`fly tokens create org`) rather than re-adding --depot=false with a
      # token that cannot use it. Prefer keeping the token app-scoped.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLERK_PK: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          flyctl deploy --remote-only \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="$CLERK_PK"

      # A green deploy step means the image shipped, not that the app came up.
      # Health is behind no auth and ahead of clerkMiddleware precisely so it can
      # answer this question.
      - name: Smoke test
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Read the app name straight out of fly.toml. `flyctl status --json`
          # would also work but its field names have moved between versions, and
          # a smoke test that breaks on a flyctl upgrade is worse than no test.
          #
          # Quote-agnostic on purpose: this was originally written for the
          # double-quoted form, then `fly launch` rewrote fly.toml with single
          # quotes and the whole line fell through, producing
          # https://app = 'es1-brew-lab'.fly.dev and 20 rounds of curl error 3.
          # Take everything after the first '=' and drop spaces and quotes; an
          # app name can contain none of them.
          APP=$(grep -m1 -E '^app[[:space:]]*=' fly.toml | cut -d= -f2- | tr -d " '\"")
          if [ -z "$APP" ]; then
            echo "Could not read the app name from fly.toml — refusing to probe a malformed URL."
            grep -n '^app' fly.toml || echo "  (no app line found)"
            exit 1
          fi
          echo "Probing https://$APP.fly.dev/api/health"
          for i in $(seq 1 20); do
            if curl -fsS "https://$APP.fly.dev/api/health" > /tmp/health.json; then
              cat /tmp/health.json; echo; exit 0
            fi
            echo "  not up yet (attempt $i)"; sleep 5
          done
          echo "Health check never passed."
          flyctl logs --no-tail | tail -50
          exit 1
