# fly.toml app configuration file generated for es1-brew-lab on 2026-08-30T20:07:53-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'es1-brew-lab'
primary_region = 'iad'

[build]
[env]
  BREWLAB_DB = '/data/brewlab.db'
  FELLOW_MODE = 'mock'
  PORT = '4000'

[[mounts]]
  source = 'brewlab_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
