# fly.toml app configuration file generated for es1-brew-lab on 2026-08-30T20:07:53-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'es1-brew-lab'
primary_region = 'iad'

[build]
[env]
  BREWLAB_DB = '/data/brewlab.db'
  PORT = '4000'
  # Claude API via workload identity federation: the server trades this Machine's
  # Fly OIDC token for a short-lived Claude token, so no API key is stored. These
  # are identifiers, not secrets. A set ANTHROPIC_API_KEY secret overrides them.
  ANTHROPIC_FEDERATION_RULE_ID = 'fdrl_01Lz2Datm7CpNv7oLo5akhNJ'
  ANTHROPIC_ORGANIZATION_ID = '919fe6ee-204d-4b02-a7f8-5779036418de'
  ANTHROPIC_SERVICE_ACCOUNT_ID = 'svac_019UXx8qUwkzEc4f2pHdHoX4'
  ANTHROPIC_WORKSPACE_ID = 'wrkspc_01SwmXo2SzH3N94AQ3v9dK5C'

[[mounts]]
  source = 'brewlab_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Was 0. Scale-to-zero is cheaper, but this app needs ~9s to start listening on
  # a shared core with a cold page cache — the machine itself boots in 1.3s, then
  # node walks a large node_modules and tsx transpiles the server. Fly's proxy
  # gives up connecting after ~8s, so the first visitor after an idle period got a
  # 502 and no reason to try again.
  #
  # Keeping one machine warm costs a few dollars a month and removes the failure
  # entirely. The way back to zero is a faster boot (precompile to JS rather than
  # running TypeScript through tsx at runtime), not a longer timeout.
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
